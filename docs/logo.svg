<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="PREMIA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15121f"/><stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="84" y1="0" x2="428" y2="0">
      <stop offset="0" stop-color="#b79cff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a2440" stroke-width="4"/>
  <!-- floating leg: funding as it actually prints -->
  <path d="M84 256 C 124 150, 164 150, 204 256 S 284 362, 324 256 S 404 150, 428 210"
        fill="none" stroke="#5b5670" stroke-width="22" stroke-linecap="round"/>
  <!-- fixed leg: what you pay instead -->
  <line x1="84" y1="256" x2="428" y2="256" stroke="url(#acc)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="84" cy="256" r="30" fill="#b79cff"/>
  <circle cx="428" cy="256" r="30" fill="#7c5cff"/>
</svg>
